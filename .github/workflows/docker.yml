# Construye la imagen de tres_p y la publica en GitHub Container Registry (ghcr.io).
#   - en cada push a la branch pipeline-reproducible: etiqueta "pipeline-reproducible" y el sha
#   - en cada tag vX.Y.Z: etiquetas X.Y.Z, X.Y y latest (docker-compose.yml fija X.Y.Z)
# Se publica para linux/amd64 y linux/arm64 (Mac con Apple Silicon).
# Antes de publicar, prueba que la imagen arranque (tres_p.py --help).
name: imagen-docker

on:
  push:
    branches: [pipeline-reproducible]
    tags: ["v*.*.*"]
  pull_request:
    branches: [pipeline-reproducible]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/tres-p

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU: para armar también la versión arm64 (Mac con Apple Silicon, Linux ARM)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Construir (sin publicar) para probar
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tres-p:prueba

      - name: Probar que arranca
        run: |
          docker run --rm tres-p:prueba --help
          docker run --rm --entrypoint git tres-p:prueba --version

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
