services:
  db:
    image: postgres:16-alpine
    container_name: tg_metricas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metricas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metricas}
      POSTGRES_DB: ${POSTGRES_DB:-resultados_metricas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metricas} -d ${POSTGRES_DB:-resultados_metricas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
