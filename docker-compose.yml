# Base de resultados + la herramienta. Uso:
#   docker compose up -d db
#   docker compose run --rm tres-p iniciar --repo org/nombre
#   docker compose run --rm tres-p todo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metricas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metricas}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metricas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tres-p:
    # Versión fija de la imagen publicada (amd64 y arm64), para que todos corran la misma; otra con
    # TRES_P_VERSION en .env. `docker compose build` la arma localmente desde este código.
    image: ghcr.io/calidad-software-tg/tres-p:${TRES_P_VERSION:-1.0.0}
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./trabajo:/app/trabajo                 # proyecto.json, datos/ y salidas/ (hallazgos y reportes)
      - ./trabajo/clones:/app/.clones          # clones descargados
      - ${TRES_P_CLON_HOST:-./trabajo/clones}:/repo:ro   # clon propio (opcional)

volumes:
  pgdata:
